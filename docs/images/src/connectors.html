<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px}svg text{font-size:17px}svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">connectors</div>
<div class="h">Five sources, and every connector <em>only reads</em>.</div>
<p class="cap">Each one turns its source's events into WorldEvents; the starter rules then pick a lane by kind.</p>
<svg viewBox="0 0 1104 560" width="1104" height="560" style="margin-top:28px">
<defs>
<marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10"/></marker>
</defs>

<text class="t" x="0" y="16">source</text>
<text class="t" x="170" y="16">signs in with</text>
<text class="mt t" x="480" y="16">escalate</text>
<text class="t" x="650" y="16">staged</text>
<text class="t" x="836" y="16">digest</text>
<text class="t" x="996" y="16">drop</text>
<path class="thin faint" d="M0 32 H1104"/>

<!-- GitHub -->
<text x="0" y="66">GitHub</text>
<text class="t" x="170" y="66">the gh CLI's token</text>
<path d="M420 60 H462" marker-end="url(#a)"/>
<text class="t" x="480" y="66">mention</text><text class="t" x="480" y="88">team_mention</text><text class="t" x="480" y="110">security_alert</text>
<text class="t" x="650" y="66">review_requested</text><text class="t" x="650" y="88">assign</text><text class="t" x="650" y="110">comment</text>
<text class="t" x="836" y="66">ci_activity</text><text class="t" x="836" y="88">author</text>
<path class="thin faint" d="M0 134 H1104"/>

<!-- Gmail -->
<text x="0" y="168">Gmail</text>
<text class="t" x="170" y="168">Google desktop OAuth</text>
<text class="t" x="170" y="190">read-only scope</text>
<path d="M420 162 H462" marker-end="url(#a)"/>
<text class="t" x="480" y="168">direct</text>
<text class="t" x="836" y="168">message</text>
<text class="t" x="996" y="168">newsletter</text>
<path class="thin faint" d="M0 214 H1104"/>

<!-- Calendar -->
<text x="0" y="248">Calendar</text>
<text class="t" x="170" y="248">same Google client</text>
<path d="M420 242 H462" marker-end="url(#a)"/>
<text class="t" x="650" y="248">event in 1 h</text>
<text class="t" x="836" y="248">event in 24 h</text>
<path class="thin faint" d="M0 272 H1104"/>

<!-- Outlook -->
<text x="0" y="306">Outlook</text>
<text class="t" x="170" y="306">Azure public client</text>
<text class="t" x="170" y="328">Mail.Read</text>
<path d="M420 300 H462" marker-end="url(#a)"/>
<text class="t" x="480" y="306">direct</text>
<text class="t" x="836" y="306">cc · message</text><text class="t" x="836" y="328">newsletter</text>
<path class="thin faint" d="M0 352 H1104"/>

<!-- Slack -->
<text x="0" y="386">Slack</text>
<text class="t" x="170" y="386">bot token, through</text>
<text class="t" x="170" y="408">the Slack reactor</text>
<path d="M420 380 H462" marker-end="url(#a)"/>
<text class="t" x="480" y="386">app_mention</text><text class="t" x="480" y="408">dm</text>
<text class="t" x="836" y="386">message</text><text class="t" x="836" y="408">(opt-in)</text>
<path class="thin faint" d="M0 432 H1104"/>

<!-- states -->
<text class="t" x="0" y="476">on the Connected apps tab</text>
<circle class="inkf" cx="10" cy="512" r="6"/><text x="26" y="518">Connected</text>
<circle class="f" cx="200" cy="512" r="6"/><text x="216" y="518">Available, not connected</text>
<circle class="f" cx="512" cy="512" r="6"/><path d="M506 512 H518"/><text x="528" y="518">Needs attention</text>
<text class="si" x="0" y="552">A connector you haven't set up is never shown as an error.</text>
</svg></div></body></html>
