<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px}svg text{font-size:17px}svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">the daily cycle</div>
<div class="h">One pulse every five minutes, <em>one brief</em> a day.</div>
<p class="cap">A LaunchAgent starts each pulse, and the steps run in this order.</p>
<svg viewBox="0 0 1104 560" width="1104" height="560" style="margin-top:28px">
<defs>
<marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10"/></marker>
<marker id="am" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="m" d="M2 2 L10 6 L2 10"/></marker>
</defs>

<!-- loop rails -->
<path d="M86 80 H1016"/>
<path d="M1016 80 C1084 80 1084 220 1028 220" marker-end="url(#a)"/>
<path d="M1016 220 H86"/>
<path d="M86 220 C18 220 18 80 74 80" marker-end="url(#a)"/>

<!-- row 1, left to right: labels above -->
<g text-anchor="middle">
<circle class="f" cx="86" cy="80" r="8"/><text x="86" y="26">self-update</text><text class="t" x="86" y="50">hourly pull</text>
<circle class="f" cx="272" cy="80" r="8"/><text x="272" y="26">drain inbox</text><text class="t" x="272" y="50">→ WorldEvents</text>
<circle class="f" cx="458" cy="80" r="8"/><text x="458" y="26">triage</text><text class="t" x="458" y="50">rules, then model</text>
<circle class="mf" cx="644" cy="80" r="9"/><text class="mt" x="644" y="26">morning brief</text><text class="t" x="644" y="50">first pulse ≥ 7:00</text>
<circle class="f" cx="830" cy="80" r="8"/><text x="830" y="26">narrator</text><text class="t" x="830" y="50">once a day</text>
<circle class="f" cx="1016" cy="80" r="8"/><text x="1016" y="26">planner</text><text class="t" x="1016" y="50">stalled goals</text>

<!-- row 2, right to left: labels below -->
<circle class="f" cx="1016" cy="220" r="8"/><text x="1016" y="258">Strategist</text><text class="t" x="1016" y="282">idle capacity only</text>
<circle class="f" cx="830" cy="220" r="8"/><text x="830" y="258">purge cards</text><text class="t" x="830" y="282">stale ones go</text>
<circle class="f" cx="644" cy="220" r="8"/><text x="644" y="258">pick batch</text><text class="t" x="644" y="282">skips paused</text>
<circle class="f" cx="458" cy="220" r="8"/><text x="458" y="258">Observer</text><text class="t" x="458" y="282">verdict → action</text>
<circle class="f" cx="272" cy="220" r="8"/><text x="272" y="258">dispatch TODOs</text><text class="t" x="272" y="282">5 busy, 2 new max</text>
<circle class="f" cx="86" cy="220" r="8"/><text x="86" y="258">save state</text><text class="t" x="86" y="282">+ heartbeat</text>

<text class="big" x="552" y="160">every 5 minutes</text>
<text class="t" x="552" y="186">lesson extractor: every 12th pulse</text>
</g>

<!-- three-day strip -->
<path class="thin faint" d="M0 330 H1104"/>
<path d="M0 450 H1104"/>
<path d="M0 442 V458"/><path d="M368 442 V458"/><path d="M736 442 V458"/><path d="M1104 442 V458"/>
<g text-anchor="middle">
<text class="t" x="184" y="484">day 1</text><text class="t" x="552" y="484">day 2</text><text class="t" x="920" y="484">day 3</text>
</g>
<circle class="mf" cx="107" cy="450" r="7"/>
<text class="mt" x="107" y="420" text-anchor="middle">brief</text>
<circle class="f" cx="475" cy="450" r="7"/>
<text x="475" y="420" text-anchor="middle">brief</text>
<circle class="f" cx="843" cy="450" r="7"/>
<text x="843" y="420" text-anchor="middle">brief</text>
<path class="d" d="M107 400 C107 380 843 380 843 398" marker-end="url(#a)"/>
<text class="t" x="475" y="364" text-anchor="middle">day 1's brief still unseen after 48 h</text>
<path d="M843 457 V500"/>
<text x="843" y="530" text-anchor="middle">its open non-escalated decisions</text>
<text class="t" x="843" y="552" text-anchor="middle">move to the digest and seed rule proposals</text>
<text class="si" x="0" y="530">You read the brief when you're ready.</text>
</svg></div></body></html>
