<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px}svg text{font-size:17px}svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">what can leave your machine</div>
<div class="h">Two doors out, both <em>shut</em> by default.</div>
<p class="cap">Every refusal is written down, so the brief can show it stayed quiet.</p>
<svg viewBox="0 0 1104 566" width="1104" height="566" style="margin-top:28px">
<defs>
<marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10"/></marker>
<marker id="am" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="m" d="M2 2 L10 6 L2 10"/></marker>
</defs>

<!-- row A: interrupt gate -->
<text x="0" y="16">notify you</text><text class="t" x="118" y="16">interrupt gate</text>
<rect class="f" x="0" y="34" width="250" height="90" rx="4"/>
<text x="16" y="62">level check</text>
<text class="t" x="16" y="86">a page needs escalate,</text>
<text class="t" x="16" y="108">urgency now, pageable</text>
<path d="M250 79 H278" marker-end="url(#a)"/>
<rect class="f" x="290" y="34" width="250" height="90" rx="4"/>
<text x="306" y="62">dedup</text>
<text class="t" x="306" y="86">once per key a day</text>
<path d="M540 79 H568" marker-end="url(#a)"/>
<rect class="w" x="580" y="34" width="250" height="90" rx="4"/>
<text x="596" y="62">budget left?</text>
<text class="t" x="596" y="86">default: page 0,</text>
<text class="t" x="596" y="108">notify 0 a day</text>
<path d="M830 79 H858" marker-end="url(#a)"/>
<text x="870" y="74">macOS alert</text>
<text class="t" x="870" y="98">only if all pass</text>

<path d="M125 124 V164"/><path d="M415 124 V164"/><path d="M705 124 V164"/>
<path d="M125 164 H705"/>
<path d="M415 164 V186" marker-end="url(#a)"/>
<text class="t" x="415" y="214" text-anchor="middle">denied · recorded in the brief's health section</text>

<!-- row B: outbound dispatcher -->
<text x="0" y="276">act for you</text><text class="t" x="128" y="276">outbound dispatcher</text>
<rect class="f" x="0" y="294" width="250" height="90" rx="4"/>
<text x="16" y="322">authorization</text>
<text class="t" x="16" y="346">you accepted the</text>
<text class="t" x="16" y="368">decision</text>
<path d="M250 339 H278" marker-end="url(#a)"/>
<rect class="f" x="290" y="294" width="250" height="90" rx="4"/>
<text x="306" y="322">action class</text>
<text class="t" x="306" y="346">enabled in the registry</text>
<path d="M540 339 H568" marker-end="url(#a)"/>
<rect class="w" x="580" y="294" width="250" height="90" rx="4"/>
<text x="596" y="322">class gate</text>
<text class="t" x="596" y="346">forbidden, draft_only,</text>
<text class="t" x="596" y="368">confirm, or standing</text>

<path class="m" d="M830 316 C846 316 846 286 858 286" marker-end="url(#am)"/>
<text class="mt" x="870" y="270">forbidden</text>
<text class="t mt" x="870" y="292">email.send</text>
<text class="t mt" x="870" y="312">slack.reply.send</text>
<path d="M830 339 C846 339 846 352 858 352" marker-end="url(#a)"/>
<text x="870" y="358">local draft</text>
<text class="t" x="870" y="380">draft_only</text>
<path d="M830 362 C846 362 846 414 858 414" marker-end="url(#a)"/>
<text x="870" y="420">not wired yet</text>
<text class="t" x="870" y="442">confirm, standing</text>

<path d="M125 384 V424"/><path d="M415 384 V424"/>
<path d="M125 424 H415"/>
<path d="M270 424 V446" marker-end="url(#a)"/>
<text class="t" x="270" y="474" text-anchor="middle">refused · recorded</text>

<!-- never row -->
<path class="thin faint" d="M0 504 H1104"/>
<text class="t" x="0" y="550">never</text>
<circle cx="90" cy="544" r="9"/><path d="M84 550 L96 538"/>
<text x="110" y="550">sends mail or Slack as you</text>
<circle cx="440" cy="544" r="9"/><path d="M434 550 L446 538"/>
<text x="460" y="550">closes a workspace</text>
<circle cx="710" cy="544" r="9"/><path d="M704 550 L716 538"/>
<text x="730" y="550">loads a daemon unasked</text>
</svg></div></body></html>
