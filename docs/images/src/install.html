<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px}svg text{font-size:17px}svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">setup</div>
<div class="h">One command installs the <em>core</em>. Everything else waits for you.</div>
<p class="cap">Run install.sh without --apply first; it only prints what it would change.</p>
<svg viewBox="0 0 1104 586" width="1104" height="586" style="margin-top:28px">
<defs>
<marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10"/></marker>
</defs>

<!-- script brackets -->
<path class="thin" d="M10 30 V20 H325 V30"/>
<text class="t" x="167" y="12" text-anchor="middle">install-bootstrap.sh</text>
<path class="thin" d="M345 30 V20 H1094 V30"/>
<text class="t" x="720" y="12" text-anchor="middle">install.sh --apply</text>

<!-- rail -->
<path d="M90 90 H1010" marker-end="url(#a)"/>
<g text-anchor="middle">
<circle class="f" cx="90" cy="90" r="8"/><text x="90" y="62">check tools</text><text class="t" x="90" y="128">git, python3,</text><text class="t" x="90" y="148">claude or droid</text>
<circle class="f" cx="245" cy="90" r="8"/><text x="245" y="62">clone</text><text class="t" x="245" y="128">~/dev/assistant</text>
<circle class="f" cx="400" cy="90" r="8"/><text x="400" y="62">ask extras</text><text class="t" x="400" y="128">[y/N] each</text>
<circle class="f" cx="555" cy="90" r="8"/><text x="555" y="62">preflight</text><text class="t" x="555" y="128">assistant-doctor</text>
<circle class="f" cx="710" cy="90" r="8"/><text x="710" y="62">link</text><text class="t" x="710" y="128">skills, bin/</text>
<circle class="mf" cx="865" cy="90" r="9"/><text class="mt" x="865" y="62">load agents</text><text class="t" x="865" y="128">core + opted in</text>
<circle class="f" cx="1022" cy="90" r="8"/><text x="1022" y="62">runbook</text><text class="t" x="1022" y="128">next steps</text>
</g>

<!-- tiers -->
<path class="thin faint" d="M0 190 H1104"/>
<rect class="f m" x="0" y="214" width="340" height="320" rx="4"/>
<text class="mt" x="18" y="246">loaded for you</text>
<text class="t" x="18" y="270">the core set</text>
<path class="thin faint" d="M18 286 H322"/>
<text class="t" x="18" y="316">assistant-pulse</text>
<text class="t" x="18" y="344">world-scanner</text>
<text class="t" x="18" y="372">session-context-watcher</text>
<text class="t" x="18" y="400">assistant-page</text>
<text class="t" x="18" y="428">assistant-todo-server</text>
<text class="t" x="18" y="512">dashboard at :9876</text>

<rect class="f" x="382" y="214" width="340" height="320" rx="4"/>
<text x="400" y="246">loaded if you opt in</text>
<text class="t" x="400" y="270">prompt or flag</text>
<path class="thin faint" d="M400 286 H704"/>
<text class="t" x="400" y="316">memory-sync-pull</text>
<text class="t" x="400" y="338">  --with-memory</text>
<text class="t" x="400" y="372">workspace-watcher</text>
<text class="t" x="400" y="394">  --with-crash-resume</text>
<text class="t" x="400" y="428">cmux-ws-numberer</text>
<text class="t" x="400" y="450">  --with-ws-numberer</text>
<text class="t" x="400" y="512">--with-all: all three</text>

<rect class="f d" x="764" y="214" width="340" height="320" rx="4"/>
<text x="782" y="246">you load by hand</text>
<text class="t" x="782" y="270">never auto-loaded</text>
<path class="thin faint" d="M782 286 H1086"/>
<text class="t" x="782" y="316">connector-github</text>
<text class="t" x="782" y="344">connector-gmail · gcal</text>
<text class="t" x="782" y="372">connector-outlook</text>
<text class="t" x="782" y="400">connector-slack</text>
<text class="t" x="782" y="428">assistant-comms</text>
<text class="t" x="782" y="456">slack-reactor</text>
<text class="t" x="782" y="484">cmux-watcher</text>
<text class="t" x="782" y="512">launchctl load …</text>
<text class="si" x="0" y="576">The right column never starts until you run launchctl load yourself.</text>
</svg></div></body></html>
