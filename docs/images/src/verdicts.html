<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px}svg text{font-size:17px}svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">your agents</div>
<div class="h">The model names a verdict. <em>Python</em> picks the action.</div>
<p class="cap">Each pulse, the Observer reads one workspace at a time and returns one verdict.</p>
<svg viewBox="0 0 1104 446" width="1104" height="446" style="margin-top:28px">
<defs>
<marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10"/></marker>
<marker id="am" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="m" d="M2 2 L10 6 L2 10"/></marker>
</defs>

<text class="t" x="0" y="16">verdict</text>
<text class="t" x="252" y="16">check in Python</text>
<text class="t" x="620" y="16">handled for you</text>
<text class="mt t" x="880" y="16">handed to you</text>
<path class="thin faint" d="M0 32 H1104"/>

<!-- ready_for_merge -->
<rect class="f d" x="0" y="54" width="212" height="48" rx="24"/>
<text x="106" y="84" text-anchor="middle">ready_for_merge</text>
<path d="M212 78 H240" marker-end="url(#a)"/>
<rect class="w" x="252" y="50" width="318" height="56" rx="4"/>
<text class="t" x="268" y="74">only test files, or an</text>
<text class="t" x="268" y="96">attested refactor?</text>
<path d="M570 78 H608" marker-end="url(#a)"/>
<text class="t" x="578" y="68">yes</text>
<text x="620" y="74">queue a merge command</text>
<text class="t" x="620" y="96">then confirm it arrived</text>
<path d="M500 106 C520 124 860 120 868 100" marker-end="url(#a)"/>
<text class="t" x="840" y="130">no</text>
<rect class="f m" x="880" y="62" width="224" height="34" rx="4"/>
<text x="896" y="85">card: your review</text>

<!-- ready_for_cleanup -->
<rect class="f d" x="0" y="160" width="212" height="48" rx="24"/>
<text x="106" y="190" text-anchor="middle">ready_for_cleanup</text>
<path d="M212 184 H240" marker-end="url(#a)"/>
<rect class="w" x="252" y="156" width="318" height="56" rx="4"/>
<text class="t" x="268" y="180">Assistant queued its merge,</text>
<text class="t" x="268" y="202">and a work receipt exists?</text>
<path d="M570 184 H608" marker-end="url(#a)"/>
<text class="t" x="578" y="174">yes</text>
<text x="620" y="190">send /cleanup</text>
<path d="M500 212 C520 230 860 226 868 206" marker-end="url(#a)"/>
<text class="t" x="840" y="236">no</text>
<rect class="f m" x="880" y="168" width="224" height="34" rx="4"/>
<text x="896" y="191">card: confirm close</text>

<!-- stranded -->
<rect class="f d" x="0" y="262" width="212" height="48" rx="24"/>
<text x="106" y="292" text-anchor="middle">stranded</text>
<path d="M212 286 H240" marker-end="url(#a)"/>
<rect class="w" x="252" y="258" width="318" height="56" rx="4"/>
<text class="t" x="268" y="282">did the same nudge go</text>
<text class="t" x="268" y="304">unread last time?</text>
<path d="M570 286 H608" marker-end="url(#a)"/>
<text class="t" x="584" y="276">no</text>
<text x="620" y="282">send a fixed retry nudge</text>
<text class="t" x="620" y="304">yes: skip this pulse</text>

<!-- needs_user -->
<rect class="f d" x="0" y="338" width="212" height="48" rx="24"/>
<text x="106" y="368" text-anchor="middle">needs_user</text>
<path d="M212 362 H868" marker-end="url(#a)"/>
<rect class="f m" x="880" y="345" width="224" height="34" rx="4"/>
<text x="896" y="368">card: its question</text>

<!-- active / no_action -->
<rect class="f d" x="0" y="400" width="212" height="40" rx="20"/>
<text x="106" y="426" text-anchor="middle">active · no_action</text>
<path d="M212 420 H608" marker-end="url(#a)"/>
<text x="620" y="426">nothing</text>
</svg></div></body></html>
